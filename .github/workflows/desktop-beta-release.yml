name: Desktop Beta Release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-beta-v*"

permissions:
  contents: read

jobs:
  build-beta:
    runs-on: windows-latest
    env:
      AI_NOVEL_RELEASE_CHANNEL: beta
      OXNOVEL_INTERNAL_PACKAGE_CODE: ${{ secrets.OXNOVEL_INTERNAL_PACKAGE_CODE }}
      OXNOVEL_RELAY_BASE_URL: ${{ secrets.OXNOVEL_RELAY_BASE_URL }}
      OXNOVEL_RELAY_ACCOUNT_BASE_URL: ${{ secrets.OXNOVEL_RELAY_ACCOUNT_BASE_URL }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install desktop icon tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Audit commercial egress
        run: pnpm verify:consumer-release

      - name: Regenerate desktop icon assets
        run: python desktop/scripts/generate-desktop-icons.py

      - name: Typecheck
        run: pnpm typecheck

      - name: Build and stage desktop app
        run: pnpm stage:desktop

      - name: Verify packaged desktop layout
        run: pnpm verify:desktop-package:reuse-stage

      - name: Build beta installer
        run: pnpm dist:desktop:nsis:reuse-stage

      - name: Generate 0xAPI package release manifest
        run: pnpm generate:package-release-manifest

      - name: Generate dependency SBOM and license inventory
        run: pnpm generate:release-metadata

      - name: Preserve beta installer
        uses: actions/upload-artifact@v4
        with:
          name: 0xNovelAgent-Windows-beta-${{ github.ref_name }}
          path: desktop/build/dist/*
          if-no-files-found: error
